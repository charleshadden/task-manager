<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="stylesheet" href="/styles.css?v=5" />
    <title>Sign Up | Habit Check</title>
  </head>
  <body data-auth-mode="signup">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Create Your Party</p>
        <h1>Sign up</h1>
        <p class="subtitle">Create a personal account so each member keeps their own quests and sync history.</p>

        <form id="authForm" class="auth-form">
          <label class="auth-field">
            <span>Email</span>
            <input id="emailInput" type="email" autocomplete="email" required />
          </label>

          <label class="auth-field">
            <span>Password</span>
            <input id="passwordInput" type="password" autocomplete="new-password" minlength="6" required />
          </label>

          <button id="submitButton" type="submit">Create account</button>
        </form>

        <p id="authStatus" class="status-text">Checking session...</p>
        <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
      </section>
    </main>

    <script type="module" src="/scripts/setup-supabase.js"></script>
    <script type="module" src="/scripts/auth.js"></script>
  </body>
</html>
